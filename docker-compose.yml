version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: sure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sure
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
